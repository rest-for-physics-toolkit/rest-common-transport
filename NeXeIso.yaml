#   restGarfield NeXeIso.yaml --jobs 25
# See ArIso.yaml.
transportManager:
  class: "TRestDetectorTransportManager"

  medium:
    class: "TRestDetectorMedium"
    name: "Ne49_Xe49_iC4H10_2"
